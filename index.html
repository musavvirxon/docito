<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicons (IMPORTANT: first icon must be valid + square for SERP) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logos/icon/docito-logo-512x512.png" />

    <!-- PWA / Cross-browser -->
    <link rel="manifest" href="/site.webmanifest" crossorigin="use-credentials" />
    <meta name="application-name" content="Docito®" />
    <meta name="apple-mobile-web-app-title" content="Docito®" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="msapplication-TileColor" content="#0ea5e9" />
    <meta name="msapplication-TileImage" content="/logos/icon/docito-logo-128x128.png" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    <link rel="mask-icon" href="/logos/icon/docito-mask-icon.svg" color="#0ea5e9" />

    <!-- Mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0ea5e9" />

    <!-- Primary Meta Tags (defaults — routes can override later) -->
    <title>Docito — Healthcare Management &amp; Booking Platform</title>
    <meta name="title" content="Docito — Healthcare Management & Booking Platform" />
    <meta name="description" content="All-in-one healthcare platform connecting patients, doctors, clinics, labs and pharmacies—booking, records, prescriptions, referrals and messaging.">
    <meta name="author" content="Docito®" />

    <!-- Yandex verification -->
    <meta name="yandex-verification" content="b14c038348da5ea3" />

    <!-- Canonical (default) -->
    <link rel="canonical" href="https://docito.app/" />

    <!-- Performance: Fonts -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
    <link rel="dns-prefetch" href="//fonts.gstatic.com" />
    <link rel="dns-prefetch" href="//gswwpjdtgsxzcsnrxutu.supabase.co" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://gswwpjdtgsxzcsnrxutu.supabase.co" />
    <link rel="preconnect" href="https://gswwpjdtgsxzcsnrxutu.supabase.co" crossorigin />

    <!-- Preload loader logos for instant FCP -->
    <link
      rel="preload"
      href="/logos/logo-full-light.png"
      as="image"
      type="image/png"
      fetchpriority="high"
    />
    <link
      rel="preload"
      href="/logos/logo-full-dark.png"
      as="image"
      type="image/png"
      fetchpriority="high"
    />

    <!-- i18n locale files loaded on demand by i18next-http-backend -->

    <!-- Load fonts async -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Serif+4:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Serif+4:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <script>
      if ("fonts" in document) {
        document.fonts.load("1em Inter");
      }
    </script>

    <!-- Open Graph -->
    <meta property="og:site_name" content="Docito®" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://docito.app/" />
    
    
    <meta property="og:image" content="https://docito.app/logos/social/docito-og-image.png">
    <meta property="og:image:alt" content="Docito® — Unified Healthcare Management & Booking Platform" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@docito" />
    <meta name="twitter:url" content="https://docito.app/" />
    
    
    <meta name="twitter:image" content="https://docito.app/logos/social/docito-og-image.png">

    <!-- Structured Data (Site name + logo for SERP) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://docito.app/#organization",
            "name": "Docito",
            "alternateName": "Docito®",
            "url": "https://docito.app/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://docito.app/logos/icon/docito-logo-512x512.png",
              "width": 512,
              "height": 512
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://docito.app/#website",
            "name": "Docito",
            "alternateName": "Docito®",
            "url": "https://docito.app/",
            "publisher": { "@id": "https://docito.app/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://docito.app/search-doctors?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
    <!-- Async CSS loading helper -->
    <script>
      // Helper function to load CSS asynchronously
      window.__loadCSS = function(href) {
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = href;
        link.media = 'print';
        link.onload = function() { this.media = 'all'; };
        document.head.appendChild(link);
      };
    </script>
    <meta property="og:title" content="Docito — Healthcare Management &amp; Booking Platform">
  <meta name="twitter:title" content="Docito — Healthcare Management &amp; Booking Platform">
  <meta property="og:description" content="All-in-one healthcare platform connecting patients, doctors, clinics, labs and pharmacies—booking, records, prescriptions, referrals and messaging.">
  <meta name="twitter:description" content="All-in-one healthcare platform connecting patients, doctors, clinics, labs and pharmacies—booking, records, prescriptions, referrals and messaging.">
</head>

  <body>
    <!-- Critical CSS for instant content visibility before JS loads -->
    <style>
      /* Critical CSS - inlined to avoid render-blocking */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { line-height: 1.5; -webkit-text-size-adjust: 100%; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; }
      body { min-height: 100vh; min-height: 100dvh; background: #fafafa; color: #0a0a0a; }
      @media (prefers-color-scheme: dark) { body { background: #0a0a0a; color: #fafafa; } }
      #root { min-height: 100vh; }
      .initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fafafa;
        z-index: 9999;
        transition: opacity 0.3s;
      }
      @media (prefers-color-scheme: dark) {
        .initial-loader { background: #0a0a0a; }
      }
      .initial-loader.hidden { opacity: 0; pointer-events: none; }
      .loader-logo {
        width: 120px;
        height: auto;
        animation: pulse 1.5s ease-in-out infinite;
      }
      /* Theme-aware loader logos */
      .loader-logo-dark { display: none; }
      .loader-logo-light { display: block; }
      @media (prefers-color-scheme: dark) {
        .loader-logo-dark { display: block; }
        .loader-logo-light { display: none; }
      }
      .dark .loader-logo-dark { display: block; }
      .dark .loader-logo-light { display: none; }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(0.98); }
      }
      /* Prevent FOUC for nav and hero */
      nav { min-height: 56px; }
      /* Font display swap for immediate text rendering */
      @font-face {
        font-family: 'Inter';
        font-display: swap;
        src: local('Inter');
      }
    </style>

    <!-- Instant visual feedback while React loads — visible until React mounts -->
    <div id="initial-loader" class="initial-loader" aria-live="polite" aria-label="Loading Docito">
        <img
          src="/logos/logo-full-light.png"
          alt="Loading Docito"
          class="loader-logo loader-logo-light"
          width="120"
          height="36"
          fetchpriority="high"
          decoding="sync"
        />
        <img
          src="/logos/800x240 horizontal logo+name.png"
          alt="Loading Docito"
          class="loader-logo loader-logo-dark"
          width="120"
          height="36"
          fetchpriority="high"
          decoding="sync"
        />
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
