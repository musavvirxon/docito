<!DOCTYPE html>
<html lang="en">
  
<head>
  <meta charset="UTF-8" />

  <!-- Favicons -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/logos/icon/docito-logo-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/logos/icon/docito-logo-32x32.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="/logos/icon/docito-logo-64x64.png" />
  <link rel="icon" type="image/png" sizes="128x128" href="/logos/icon/docito-logo-128x128.png" />
  <link rel="icon" type="image/png" sizes="256x256" href="/logos/icon/docito-logo-256x256.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/logos/icon/docito-logo-512x512.png" />
  <link rel="apple-touch-icon" href="/logos/icon/docito-logo-512x512.png" />

  <!-- Mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0ea5e9" />

  <!-- Primary Meta Tags (defaults — routes can override later) -->
  <title>Docito® — Unified Healthcare Management & Booking Platform</title>
  <meta name="title" content="Docito® — Unified Healthcare Management & Booking Platform" />
  <meta
    name="description"
    content="Docito® is a unified healthcare management and booking platform connecting patients, doctors, clinics, labs, pharmacies, imaging centers, hospitals, and insurance—secure scheduling, referrals, records, prescriptions, messaging, and analytics."
  />
  <meta name="author" content="Docito®" />

  <!-- Canonical (default) -->
  <link rel="canonical" href="https://docito.com/" />

  <!-- Performance: Fonts -->
  <link rel="dns-prefetch" href="//fonts.googleapis.com" />
  <link rel="dns-prefetch" href="//fonts.gstatic.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Preconnect to Supabase -->
  <link rel="preconnect" href="https://gswwpjdtgsxzcsnrxutu.supabase.co" />
  <link rel="dns-prefetch" href="//gswwpjdtgsxzcsnrxutu.supabase.co" />

  <!-- Preload critical LCP images -->
  <link rel="preload" href="/logos/horizontal/docito-horizontal-2xl.webp" as="image" type="image/webp" fetchpriority="high" />
  <link rel="preload" href="/logos/horizontal/docito-horizontal-2xl.png" as="image" type="image/png" />

  <!-- Load fonts async -->
  <link
    rel="preload"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Serif+4:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    as="style"
    onload="this.onload=null;this.rel='stylesheet'"
  />
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Serif+4:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </noscript>

  <script>
    if ('fonts' in document) {
      document.fonts.load('1em Inter');
    }
  </script>

  <!-- Open Graph -->
  <meta property="og:site_name" content="Docito®" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://docito.com/" />
  <meta property="og:title" content="Docito® — Unified Healthcare Management & Booking Platform" />
  <meta
    property="og:description"
    content="One platform connecting patients, doctors, clinics, labs, pharmacies, imaging centers, hospitals, and insurance—secure scheduling, referrals, records, prescriptions, messaging, and analytics."
  />
  <meta property="og:image" content="https://docito.com/logos/social/docito-og-image.png" />
  <meta property="og:image:alt" content="Docito® — Unified Healthcare Management & Booking Platform" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@docito" />
  <meta name="twitter:url" content="https://docito.com/" />
  <meta name="twitter:title" content="Docito® — Unified Healthcare Management & Booking Platform" />
  <meta
    name="twitter:description"
    content="Unified healthcare platform for appointments, referrals, records, prescriptions, messaging, and analytics—connecting patients, providers, and facilities."
  />
  <meta name="twitter:image" content="https://docito.com/logos/social/docito-og-image.png" />
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
