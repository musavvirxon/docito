<svg width="100%" viewBox="0 0 740 520" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Cover image for "How a Treatment Plan Actually Moves Through Docito" blog post</title>
  <desc>An editorial illustration of a simplified dental arch chart with color-coded tooth statuses, above a three-step workflow arrow, on a warm clinical background.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="740" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a2332"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="740" height="520" fill="url(#bg2)"/>
  <g>
    <circle cx="150" cy="150" r="22" fill="#1f2937" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="200" cy="128" r="22" fill="#1f2937" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="252" cy="112" r="22" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="306" cy="102" r="22" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
    <circle cx="362" cy="98" r="22" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="418" cy="102" r="22" fill="#78350f" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="472" cy="112" r="22" fill="#1e3a5f" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="524" cy="128" r="22" fill="#134e4a" stroke="#5eead4" stroke-width="2"/>
    <circle cx="574" cy="150" r="22" fill="#3b0764" stroke="#c084fc" stroke-width="2"/>
    <circle cx="616" cy="176" r="20" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4"/>
  </g>
  <path d="M150 150 C 250 90, 470 90, 616 176" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="2 6" opacity="0.7"/>
  <g font-family="Arial, sans-serif">
    <circle cx="160" cy="330" r="22" fill="none" stroke="#5eead4" stroke-width="2"/>
    <text x="160" y="336" text-anchor="middle" font-size="16" fill="#5eead4" font-weight="700">1</text>
    <text x="160" y="368" text-anchor="middle" font-size="13" fill="#cbd5e1">Plan</text>
    <path d="M195 330 L 275 330" stroke="#5eead4" stroke-width="2" marker-end="url(#arrhead)"/>
    <circle cx="310" cy="330" r="22" fill="none" stroke="#5eead4" stroke-width="2"/>
    <text x="310" y="336" text-anchor="middle" font-size="16" fill="#5eead4" font-weight="700">2</text>
    <text x="310" y="368" text-anchor="middle" font-size="13" fill="#cbd5e1">Procedures</text>
    <path d="M345 330 L 425 330" stroke="#5eead4" stroke-width="2" marker-end="url(#arrhead)"/>
    <circle cx="460" cy="330" r="22" fill="none" stroke="#5eead4" stroke-width="2"/>
    <text x="460" y="336" text-anchor="middle" font-size="16" fill="#5eead4" font-weight="700">3</text>
    <text x="460" y="368" text-anchor="middle" font-size="13" fill="#cbd5e1">Chart</text>
    <path d="M495 330 L 575 330" stroke="#5eead4" stroke-width="2" marker-end="url(#arrhead)"/>
    <circle cx="610" cy="330" r="22" fill="#0d9488" stroke="#5eead4" stroke-width="2"/>
    <text x="610" y="336" text-anchor="middle" font-size="14" fill="#eafffb" font-weight="700">$</text>
    <text x="610" y="368" text-anchor="middle" font-size="13" fill="#cbd5e1">Charge</text>
  </g>
  <defs>
    <marker id="arrhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5eead4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="60" y="450" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#eafffb">A Treatment Plan, Step by Step</text>
  <text x="60" y="480" font-family="Arial, sans-serif" font-size="15" fill="#9adfd4">From diagnosis to a tracked, billable plan</text>
</svg>
